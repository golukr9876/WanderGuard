    body{margin:0;font-family:Arial, sans-serif;background:#f9fafb;color:#111}
header{
  background:#2563eb;color:#fff;padding:10px;
  text-align:center;font-weight:bold;
  position: relative; /* for absolute children like profile */
}
#searchBar{padding:10px;text-align:center;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
#searchBox{width:80%;max-width:500px;padding:8px;border:1px solid #ccc;border-radius:6px}
.container{display:grid;grid-template-columns:3fr 1fr;height:calc(100vh - 100px)}
#map{height:100%;width:100%}
.sidebar{background:#fff;padding:10px;overflow-y:auto}
.btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin:5px 0;display:inline-block}
.btn-primary{background:#2563eb;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.card{border:1px solid #eee;border-radius:8px;padding:8px;margin-bottom:8px;background:#fff}
#panicBtn{position:fixed;bottom:20px;right:20px;width:70px;height:70px;border-radius:50%;background:red;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
ul{padding-left:20px}

/* Profile icon */
#profileContainer {
  position: absolute;
  top: 10px;
  right: 20px;
  cursor: pointer;
  z-index: 1000;
}
#profilePic {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  border: 2px solid #fff;
  object-fit: cover;
}

/* Responsive adjustments */
@media(max-width: 1024px){
  .container{grid-template-columns:2fr 1fr}
}

@media(max-width: 768px){
  .container{grid-template-columns:1fr;height:auto}
  #map{height:400px}
  .sidebar{height:auto;margin-top:10px}
  #searchBox{width:95%}
  #profileContainer{top:8px;right:10px}
}

  </style>
</head>
<body>
<header>
  Wander Guard
  <div id="profileContainer">
    <img id="profilePic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" title="Account" />
  </div>
</header>

<div id="searchBar">
  <input type="text" id="searchBox" placeholder="🔍 Search location...">
</div>
<div class="container">
  <div id="map"></div>
  <div class="sidebar">
    <div id="details" class="card">
      <h3>Location Details</h3>
      <p>No location selected.</p>
    </div>
    <div class="card">
      <h3>Nearby Places</h3>
      <div id="nearby"></div>
    </div>
    <div class="card">
      <h3>Wishlist</h3>
      <ul id="wishlist"></ul>
    </div>
  </div>
</div>
<button id="panicBtn">PANIC</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Map initialization
  const map = L.map('map').setView([26.9124,75.7873], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let wishlist = [];
  let routeLayers = [];
  let currentLatLng = null;
  let lastSearch = null;

  // Custom icons
  const iconPolice = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/190/190493.png',
    iconSize: [25, 25], iconAnchor: [12, 12],
  });
  const iconHospital = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/2965/2965567.png',
    iconSize: [25, 25], iconAnchor: [12, 12],
  });
  const iconAttraction = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/854/854878.png',
    iconSize: [25, 25], iconAnchor: [12, 12],
  });
  const iconSearch = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
    iconSize: [30, 30], iconAnchor: [15, 30]
  });

  // Get user current location
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      currentLatLng = [pos.coords.latitude, pos.coords.longitude];
      L.circleMarker(currentLatLng, {
        radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
      }).addTo(map).bindPopup("📍 You are here");
      map.setView(currentLatLng, 14);
    });
  }

  // Search functionality
  document.getElementById('searchBox').addEventListener('keypress', e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const q = e.target.value;
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`)
        .then(r => r.json()).then(data => {
          if (data.length > 0) {
            const place = data[0];
            const lat = parseFloat(place.lat), lng = parseFloat(place.lon);
            lastSearch = [lat, lng];
            L.marker([lat, lng], { icon: iconSearch }).addTo(map).bindPopup(place.display_name).openPopup();
            showDetails(place);
            showNearby(lat, lng);
          } else {
            alert("Location not found.");
          }
        });
    }
  });

  function showDetails(place) {
    const safetyScore = Math.floor(Math.random()*40) + 60;
    document.getElementById('details').innerHTML = `
      <h3>${place.display_name.split(",")[0]}</h3>
      <p><b>Address:</b> ${place.display_name}</p>
      <p><b>Safety Score:</b> ${safetyScore}/100</p>
      <button class="btn btn-primary" onclick="addWishlist('${place.display_name}')">Add to Wishlist</button>
      <button class="btn btn-primary" onclick="getDirections()">Get Directions</button>
    `;
  }

  function addWishlist(name) {
    wishlist.push(name);
    const ul = document.getElementById('wishlist');
    const li = document.createElement('li');
    li.textContent = name;
    ul.appendChild(li);
  }

  function showNearby(lat, lng) {
    const nearbyData = {
      police: [
        { name: "Police Station MI Road", phone: "+91-8765432109", loc: [lat + 0.008, lng + 0.008] },
        { name: "Police Station Amer", phone: "+91-9988776655", loc: [lat - 0.01, lng + 0.01] }
      ],
      hospital: [
        { name: "City Hospital", phone: "+91-9123456780", loc: [lat + 0.012, lng - 0.008] },
        { name: "Jaipur Medical", phone: "+91-9345678901", loc: [lat - 0.015, lng - 0.012] }
      ],
      attractions: [
        { name: "Hawa Mahal", loc: [lat + 0.006, lng + 0.006] },
        { name: "City Palace", loc: [lat - 0.007, lng + 0.009] }
      ]
    };

    document.getElementById('nearby').innerHTML = "";
    ["police","hospital","attractions"].forEach(cat => {
      const div = document.createElement('div');
      div.innerHTML = `<b>${cat.toUpperCase()}</b><ul>` +
        nearbyData[cat].map(p => `<li>${p.name}${p.phone? (" (" + p.phone + ")") : ""}</li>`).join("") +
        `</ul>`;
      document.getElementById('nearby').appendChild(div);

      nearbyData[cat].forEach(p => {
        let iconToUse = iconAttraction;
        if (cat === "police") iconToUse = iconPolice;
        if (cat === "hospital") iconToUse = iconHospital;
        L.marker(p.loc, { icon: iconToUse })
          .addTo(map)
          .bindPopup(`${p.name}${p.phone?("<br>" + p.phone):""}`);
      });
    });
  }

      alert("Current location or destination missing!");

async function getDirections() {
  if (!currentLatLng || !lastSearch) {
    alert("Current location or destination missing!");
    return;
  }
  
  // Clear old routes
  routeLayers.forEach(r => map.removeLayer(r));
  routeLayers = [];

  const origin = currentLatLng;
  const dest = lastSearch;

  const colors = ["green", "orange", "red"];
  const labels = ["Safe (90/100)", "Moderate (70/100)", "Risky (50/100)"];

  try {
    const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${dest[1]},${dest[0]}?alternatives=true&geometries=geojson`);
    const data = await response.json();

    if (data.routes.length === 0) {
      alert("No routes found!");
      return;
    }

    data.routes.slice(0, 3).forEach((route, index) => {
      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]); // flip [lng,lat] -> [lat,lng]
      const poly = L.polyline(coords, { color: colors[index], weight: 5, opacity: 0.7 }).addTo(map);
      poly.bindPopup(`Route ${index+1}: ${labels[index]}<br>Distance: ${(route.distance/1000).toFixed(2)} km<br>Duration: ${(route.duration/60).toFixed(1)} min`);
      routeLayers.push(poly);
    });

    // Fit map to the route bounds
    const allCoords = routeLayers.flatMap(r => r.getLatLngs());
    map.fitBounds(allCoords);

  } catch (err) {
    console.error(err);
    alert("Error fetching directions.");
  }
}


  document.getElementById('panicBtn').addEventListener('click', () => {
    alert("🚨 Panic Alert Sent! Emergency services have been notified (demo).");
  });









  // Simulate user account data
let user = null; // null means no account, otherwise {name, pic}

const profileContainer = document.getElementById('profileContainer');
const profilePic = document.getElementById('profilePic');

// Create dropdown menu
const dropdown = document.createElement('div');
dropdown.style.position = 'absolute';
dropdown.style.top = '50px';
dropdown.style.right = '0';
dropdown.style.background = '#fff';
dropdown.style.border = '1px solid #ccc';
dropdown.style.borderRadius = '6px';
dropdown.style.padding = '10px';
dropdown.style.boxShadow = '0 2px 6px rgba(0,0,0,.2)';
dropdown.style.display = 'none';
dropdown.style.minWidth = '150px';
dropdown.innerHTML = `
  <div id="userName" style="margin-bottom:10px;font-weight:bold;"></div>
  <button id="loginBtn" class="btn btn-primary" style="width:100%;margin-bottom:5px;">Login</button>
  <button id="logoutBtn" class="btn btn-danger" style="width:100%;margin-bottom:5px;">Logout</button>
  <button id="createBtn" class="btn btn-primary" style="width:100%;">Create Account</button>
`;
profileContainer.appendChild(dropdown);

// Show/Hide dropdown on click
profileContainer.addEventListener('click', () => {
  dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
});

// Update UI based on user login status
function updateProfileUI() {
  if (user) {
    profilePic.src = user.pic || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
    dropdown.querySelector('#userName').textContent = user.name;
    dropdown.querySelector('#loginBtn').style.display = 'none';
    dropdown.querySelector('#logoutBtn').style.display = 'block';
    dropdown.querySelector('#createBtn').style.display = 'none';
  } else {
    profilePic.src = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
    dropdown.querySelector('#userName').textContent = 'Guest';
    dropdown.querySelector('#loginBtn').style.display = 'block';
    dropdown.querySelector('#logoutBtn').style.display = 'none';
    dropdown.querySelector('#createBtn').style.display = 'block';
  }
}

// Button actions
dropdown.querySelector('#loginBtn').addEventListener('click', () => {
  user = { name: "John Doe", pic: "https://randomuser.me/api/portraits/men/32.jpg" };
  updateProfileUI();
  dropdown.style.display = 'none';
});

dropdown.querySelector('#logoutBtn').addEventListener('click', () => {
  user = null;
  updateProfileUI();
  dropdown.style.display = 'none';
});

dropdown.querySelector('#createBtn').addEventListener('click', () => {
  user = { name: "New User", pic: "https://randomuser.me/api/portraits/women/44.jpg" };
  updateProfileUI();
  dropdown.style.display = 'none';
});

// Initial UI
updateProfileUI();

</script>
</body>
</html>
